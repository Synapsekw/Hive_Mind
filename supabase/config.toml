project_id = "hive-mind"

# The caller has no JWT yet: the agent token in the body is the credential.
[functions.agent-session]
verify_jwt = false

# The caller has no JWT yet: the sync key in the body is the credential.
[functions.sync-session]
verify_jwt = false

# The caller's pass is an app's, issued by the OAuth server below, not a session
# the gateway can check: the function hands it to connector_login and the
# database verifies it.
[functions.mcp]
verify_jwt = false

# The caller's pass is the hive owner's own session, which the gateway could
# check, but the question is not "is this a session" but "may this person send
# for this invitation": the function hands the pass to invitation_to_email and
# the database answers, as for the two functions above.
[functions.invite-email]
verify_jwt = false

# The caller is the database's scheduler, which has no session: its credential
# is the shared secret in the x-purge-secret header, which the function
# compares with its own HIVE_PURGE_SECRET before it does anything.
[functions.purge-hives]
verify_jwt = false

# Supabase Auth as the OAuth 2.1 server for the remote connector. The approval
# window is the web app's /oauth/consent page; the address Auth sends people to
# is the Site URL plus this path. Dynamic registration is OFF on purpose: an app
# approved by a member receives an ID token that Supabase Auth accepts for a
# password change (vault gotcha 07), so only apps registered by hand may exist.
# The hosted project has the same three switches (docs/hosted-db-bringup.md).
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false
